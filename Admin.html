<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin Ican2233</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#0b101d] min-h-screen pb-20 font-sans text-slate-300">

    <div class="bg-gradient-to-b from-blue-600 to-indigo-900 p-8 shadow-2xl mb-6 rounded-b-[3rem] border-b-2 border-blue-400/20 text-center">
        <h1 class="text-2xl font-black italic tracking-tighter text-white uppercase">Master Global Admin</h1>
        <p class="text-[9px] opacity-60 tracking-[0.5em] uppercase mt-1">Ican2233 Secure Controller</p>
    </div>

    <div class="max-w-md mx-auto px-4">
        
        <div class="bg-slate-900/50 backdrop-blur-md p-6 rounded-3xl border border-white/5 mb-6">
            <div id="loginArea">
                <input type="password" id="ghToken" placeholder="GitHub Token (ghp_...)" class="w-full p-4 bg-black/40 border border-slate-700 rounded-2xl mb-4 outline-none text-sm text-emerald-400 focus:border-blue-500 transition shadow-inner">
                <button onclick="fetchAllRepos()" class="w-full bg-blue-600 hover:bg-blue-500 text-white p-4 rounded-2xl font-black text-xs transition active:scale-95 uppercase tracking-widest shadow-lg">Connect GitHub</button>
            </div>

            <div id="selectorArea" class="hidden space-y-4 mt-2">
                <select id="repoSelect" onchange="fetchFiles()" class="w-full p-4 bg-slate-800 rounded-2xl font-bold text-sm border border-slate-700 outline-none focus:border-blue-500 text-white appearance-none"></select>
                <select id="fileSelect" class="w-full p-4 bg-slate-800 rounded-2xl font-bold text-sm border border-slate-700 outline-none focus:border-indigo-500 text-white appearance-none"></select>
                <button onclick="loadJsonData()" class="w-full bg-indigo-600 text-white p-4 rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg active:scale-95 transition">Muat Database</button>
            </div>
        </div>

        <div id="editorArea" class="hidden bg-slate-900 p-6 rounded-[2.5rem] shadow-2xl mb-8 border-l-8 border-emerald-500">
            <h2 id="formTitle" class="text-emerald-400 font-black text-[10px] mb-6 uppercase tracking-widest">User Management</h2>
            <div id="dynamicInputs" class="space-y-5"></div>
            <div class="flex gap-3 mt-8">
                <button onclick="saveData()" id="btnSave" class="flex-1 bg-emerald-600 text-white p-5 rounded-2xl font-black text-xs uppercase hover:bg-emerald-500 transition shadow-lg active:scale-95">Simpan Data</button>
                <button id="btnCancel" onclick="resetForm()" class="hidden bg-slate-700 text-white p-5 rounded-2xl font-black text-xs uppercase">Batal</button>
            </div>
        </div>

        <div id="dataArea" class="hidden">
            <div class="relative mb-6">
                <i class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-slate-500"></i>
                <input type="text" id="searchInput" onkeyup="filterData()" placeholder="Cari ID atau Expiry..." class="w-full p-5 pl-14 bg-slate-900 rounded-2xl border border-slate-800 outline-none text-sm focus:border-blue-500 shadow-xl">
            </div>
            
            <div id="userList" class="space-y-4"></div>
        </div>

    </div>

    <script>
        const OWNER = 'Ican2233';
        let fullData = null; // Menyimpan seluruh file JSON
        let usersArray = []; // Referensi ke bagian array user
        let currentFields = [];

        async function fetchAllRepos() {
            const token = document.getElementById('ghToken').value;
            try {
                const res = await fetch(`https://api.github.com/users/${OWNER}/repos?per_page=100&sort=updated`, {
                    headers: { Authorization: `token ${token}` }
                });
                const repos = await res.json();
                const select = document.getElementById('repoSelect');
                select.innerHTML = '<option value="">-- PILIH REPOSITORY --</option>';
                repos.forEach(r => select.innerHTML += `<option value="${r.name}">${r.name.toUpperCase()}</option>`);
                document.getElementById('selectorArea').classList.remove('hidden');
                document.getElementById('loginArea').classList.add('hidden');
            } catch (e) { alert("Token Salah!"); }
        }

        async function fetchFiles() {
            const token = document.getElementById('ghToken').value;
            const repo = document.getElementById('repoSelect').value;
            const res = await fetch(`https://api.github.com/repos/${OWNER}/${repo}/contents/`, {
                headers: { Authorization: `token ${token}` }
            });
            const files = await res.json();
            const select = document.getElementById('fileSelect');
            select.innerHTML = '<option value="">-- PILIH FILE JSON --</option>';
            files.filter(f => f.name.endsWith('.json')).forEach(f => select.innerHTML += `<option value="${f.name}">${f.name}</option>`);
        }

        async function loadJsonData() {
            const token = document.getElementById('ghToken').value;
            const repo = document.getElementById('repoSelect').value;
            const file = document.getElementById('fileSelect').value;
            const res = await fetch(`https://api.github.com/repos/${OWNER}/${repo}/contents/${file}`, {
                headers: { Authorization: `token ${token}` },
                cache: 'no-store'
            });
            const data = await res.json();
            fullData = JSON.parse(atob(data.content));
            
            // Logika Deteksi: Jika JSON punya kunci "Users", ambil isinya
            usersArray = Array.isArray(fullData) ? fullData : (fullData.Users || []);
            
            if(usersArray.length > 0) currentFields = Object.keys(usersArray[0]);
            else currentFields = ['ID', 'Expiry'];

            generateInputs();
            renderUsers(usersArray);
            document.getElementById('editorArea').classList.remove('hidden');
            document.getElementById('dataArea').classList.remove('hidden');
        }

        function generateInputs() {
            const container = document.getElementById('dynamicInputs');
            container.innerHTML = `<input type="hidden" id="editIndex" value="-1">`;
            currentFields.forEach(f => {
                // Gunakan tipe date jika nama field adalah Expiry atau Expiration
                const isDate = f.toLowerCase().includes('exp');
                container.innerHTML += `
                    <div>
                        <label class="text-[10px] text-slate-500 font-bold uppercase ml-2 tracking-widest">${f}</label>
                        <input type="${isDate ? 'date' : 'text'}" id="field_${f}" class="w-full p-4 bg-slate-950 border border-slate-800 rounded-2xl outline-none text-sm text-white focus:border-blue-500">
                    </div>`;
            });
        }

        function renderUsers(data) {
            const list = document.getElementById('userList');
            list.innerHTML = '';
            data.forEach((u, i) => {
                let detailList = '';
                Object.keys(u).forEach(key => {
                    detailList += `
                        <div class="flex justify-between py-1 border-b border-white/5 text-[10px]">
                            <span class="text-slate-500 uppercase font-black">${key}</span>
                            <span class="text-blue-400 font-mono">${u[key]}</span>
                        </div>`;
                });

                list.innerHTML += `
                    <div class="bg-slate-900/80 p-6 rounded-[2rem] border border-white/5 shadow-xl">
                        <div class="flex justify-between items-start mb-4">
                            <div class="truncate pr-4">
                                <div class="text-[8px] text-emerald-400 font-bold mb-1">USER #${i+1}</div>
                                <div class="font-black text-white text-lg tracking-tighter uppercase italic">${u.ID || u.username || 'UNKNOWN'}</div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="editMode(${i})" class="w-10 h-10 rounded-xl bg-blue-500/10 text-blue-400 border border-blue-500/20 flex items-center justify-center"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="deleteUser(${i})" class="w-10 h-10 rounded-xl bg-red-500/10 text-red-400 border border-red-500/20 flex items-center justify-center"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                        <div class="bg-black/30 p-4 rounded-2xl space-y-1">${detailList}</div>
                    </div>`;
            });
        }

        function editMode(i) {
            const u = usersArray[i];
            document.getElementById('editIndex').value = i;
            currentFields.forEach(f => {
                let val = u[f];
                // Convert tanggal DD/MM/YYYY ke format input date YYYY-MM-DD
                if(f.toLowerCase().includes('exp') && val.includes('/')) {
                    const parts = val.split('/');
                    val = `${parts[2]}-${parts[1]}-${parts[0]}`;
                }
                document.getElementById(`field_${f}`).value = val;
            });
            document.getElementById('btnCancel').classList.remove('hidden');
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        async function saveData() {
            const index = parseInt(document.getElementById('editIndex').value);
            let userObj = {};
            currentFields.forEach(f => {
                let val = document.getElementById(`field_${f}`).value;
                // Convert kembali YYYY-MM-DD ke DD/MM/YYYY jika Expiry
                if(f.toLowerCase().includes('exp') && val.includes('-')) {
                    const parts = val.split('-');
                    val = `${parts[2]}/${parts[1]}/${parts[0]}`;
                }
                userObj[f] = val;
            });

            if(index === -1) usersArray.push(userObj); else usersArray[index] = userObj;
            
            // Sinkronisasi: Masukkan kembali ke struktur asli fullData
            if (!Array.isArray(fullData)) fullData.Users = usersArray;
            else fullData = usersArray;

            await pushToGitHub();
            resetForm();
        }

        async function pushToGitHub() {
            const token = document.getElementById('ghToken').value;
            const repo = document.getElementById('repoSelect').value;
            const file = document.getElementById('fileSelect').value;
            const btn = document.getElementById('btnSave');
            
            btn.innerText = "WAIT..."; btn.disabled = true;
            try {
                const resSha = await fetch(`https://api.github.com/repos/${OWNER}/${repo}/contents/${file}`, {
                    headers: { Authorization: `token ${token}` }
                });
                const dataSha = await resSha.json();
                const res = await fetch(`https://api.github.com/repos/${OWNER}/${repo}/contents/${file}`, {
                    method: 'PUT',
                    headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: "Sync Data",
                        content: btoa(JSON.stringify(fullData, null, 2)),
                        sha: dataSha.sha
                    })
                });
                if(res.ok) alert("Sukses Tersimpan!");
                loadJsonData();
            } catch (e) { alert("Gagal!"); }
            finally { btn.innerText = "Simpan Data"; btn.disabled = false; }
        }

        function resetForm() {
            document.getElementById('editIndex').value = "-1";
            currentFields.forEach(f => document.getElementById(`field_${f}`).value = "");
            document.getElementById('btnCancel').classList.add('hidden');
        }

        async function deleteUser(i) {
            if(!confirm("Hapus?")) return;
            usersArray.splice(i, 1);
            if (!Array.isArray(fullData)) fullData.Users = usersArray; else fullData = usersArray;
            await pushToGitHub();
        }

        function filterData() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = usersArray.filter(u => Object.values(u).some(v => String(v).toLowerCase().includes(q)));
            renderUsers(filtered);
        }
    </script>
</body>
</html>
