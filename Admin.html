<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Admin Ican2233</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#0b0f1a] min-h-screen pb-20 font-sans text-slate-200">

    <div class="bg-gradient-to-r from-blue-700 to-indigo-900 p-8 shadow-2xl mb-6 rounded-b-[3rem] border-b border-white/10 text-center">
        <h1 class="text-2xl font-black tracking-tighter italic text-white uppercase">Super Control Panel</h1>
        <p class="text-[10px] opacity-70 tracking-[0.4em] uppercase mt-1 text-blue-200">User & Config Manager</p>
    </div>

    <div class="max-w-md mx-auto px-4">
        
        <div class="bg-slate-900/80 backdrop-blur-md p-6 rounded-3xl border border-white/5 mb-6 shadow-xl">
            <div id="loginArea">
                <input type="password" id="ghToken" placeholder="GitHub Token" class="w-full p-4 bg-black/40 border border-slate-700 rounded-2xl mb-4 outline-none text-sm text-emerald-400 focus:border-blue-500">
                <button onclick="fetchAllRepos()" class="w-full bg-blue-600 hover:bg-blue-500 text-white p-4 rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg active:scale-95 transition">Hubungkan Akun</button>
            </div>

            <div id="selectorArea" class="hidden space-y-4 mt-4 animate-in fade-in">
                <select id="repoSelect" onchange="fetchFiles()" class="w-full p-4 bg-slate-800 rounded-2xl font-bold text-sm border border-slate-600 text-white outline-none"></select>
                <select id="fileSelect" class="w-full p-4 bg-slate-800 rounded-2xl font-bold text-sm border border-slate-600 text-white outline-none"></select>
                <button onclick="loadJsonData()" class="w-full bg-indigo-600 text-white p-4 rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg">Buka File</button>
            </div>
        </div>

        <div id="configEditorArea" class="hidden bg-slate-900 p-6 rounded-[2.5rem] shadow-2xl mb-8 border-t-8 border-amber-500 border border-white/5">
            <h2 class="text-amber-400 font-black text-[10px] mb-6 uppercase tracking-widest flex items-center">
                <i class="fa-solid fa-gear mr-2"></i> Global Configuration
            </h2>
            <div id="configInputs" class="space-y-4"></div>
            <button onclick="saveGlobalConfig()" class="w-full mt-6 bg-amber-600 text-white p-5 rounded-2xl font-black text-xs uppercase shadow-lg active:scale-95 transition">Update Config</button>
        </div>

        <div id="userPanelArea" class="hidden space-y-6">
            <div class="bg-slate-900 p-6 rounded-[2.5rem] shadow-2xl border-l-8 border-emerald-500 border border-white/5">
                <h2 id="formTitle" class="text-emerald-400 font-black text-[10px] mb-6 uppercase tracking-widest">User Editor</h2>
                <div id="dynamicUserInputs" class="space-y-4"></div>
                <div class="flex gap-3 mt-8">
                    <button onclick="saveUserData()" id="btnSaveUser" class="flex-1 bg-emerald-600 text-white p-5 rounded-2xl font-black text-xs uppercase shadow-lg active:scale-95 transition">Simpan User</button>
                    <button id="btnCancel" onclick="resetForm()" class="hidden bg-slate-700 text-white p-5 rounded-2xl font-black text-xs uppercase">Batal</button>
                </div>
            </div>

            <div id="dataArea">
                <div class="relative mb-6">
                    <i class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    <input type="text" id="searchInput" onkeyup="filterData()" placeholder="Cari user..." class="w-full p-5 pl-14 bg-slate-900 rounded-2xl border border-slate-800 outline-none text-sm focus:border-blue-500 shadow-xl">
                </div>
                <div id="userList" class="space-y-4"></div>
            </div>
        </div>

    </div>

    <script>
        const OWNER = 'Ican2233';
        let fullData = null; // Menyimpan seluruh file JSON
        let userArrayRef = null; // Referensi ke bagian daftar User
        let userFields = [];

        async function fetchAllRepos() {
            const token = document.getElementById('ghToken').value;
            try {
                const res = await fetch(`https://api.github.com/users/${OWNER}/repos?per_page=100&sort=updated`, {
                    headers: { Authorization: `token ${token}` }
                });
                const repos = await res.json();
                const select = document.getElementById('repoSelect');
                select.innerHTML = '<option value="">-- PILIH REPO --</option>';
                repos.forEach(r => select.innerHTML += `<option value="${r.name}">${r.name.toUpperCase()}</option>`);
                document.getElementById('selectorArea').classList.remove('hidden');
                document.getElementById('loginArea').classList.add('hidden');
            } catch (e) { alert("Token Gagal!"); }
        }

        async function fetchFiles() {
            const token = document.getElementById('ghToken').value;
            const repo = document.getElementById('repoSelect').value;
            const res = await fetch(`https://api.github.com/repos/${OWNER}/${repo}/contents/`, {
                headers: { Authorization: `token ${token}` }
            });
            const files = await res.json();
            const select = document.getElementById('fileSelect');
            select.innerHTML = '<option value="">-- PILIH FILE --</option>';
            files.filter(f => f.name.endsWith('.json')).forEach(f => select.innerHTML += `<option value="${f.name}">${f.name}</option>`);
        }

        async function loadJsonData() {
            const token = document.getElementById('ghToken').value;
            const repo = document.getElementById('repoSelect').value;
            const file = document.getElementById('fileSelect').value;
            const res = await fetch(`https://api.github.com/repos/${OWNER}/${repo}/contents/${file}`, {
                headers: { Authorization: `token ${token}` },
                cache: 'no-store'
            });
            const data = await res.json();
            fullData = JSON.parse(atob(data.content));
            
            // RESET TAMPILAN
            document.getElementById('configEditorArea').classList.add('hidden');
            document.getElementById('userPanelArea').classList.add('hidden');
            document.getElementById('configInputs').innerHTML = '';

            // DETEKSI STRUKTUR (Pisahkan Config Global dan Daftar User)
            processData(fullData);
        }

        function processData(obj) {
            let userKeyFound = null;

            // Cari di mana letak Array User (bisa di root atau di dalam key "Users")
            if (Array.isArray(obj)) {
                userArrayRef = obj;
            } else {
                for (let key in obj) {
                    if (Array.isArray(obj[key])) {
                        userKeyFound = key;
                        userArrayRef = obj[key];
                    } else if (typeof obj[key] !== 'object') {
                        // Tampilkan sebagai Global Config
                        renderConfigInput(key, obj);
                    }
                }
            }

            if (userArrayRef) {
                document.getElementById('userPanelArea').classList.remove('hidden');
                userFields = userArrayRef.length > 0 ? Object.keys(userArrayRef[0]) : ['ID', 'Expiry'];
                generateUserInputs();
                renderUserList(userArrayRef);
            }
            
            if (document.getElementById('configInputs').innerHTML !== '') {
                document.getElementById('configEditorArea').classList.remove('hidden');
            }
        }

        function renderConfigInput(key, parent) {
            const container = document.getElementById('configInputs');
            container.innerHTML += `
                <div>
                    <label class="text-[9px] text-slate-500 font-black uppercase tracking-widest ml-2">${key}</label>
                    <input type="text" id="global_${key}" value="${parent[key]}" 
                    class="w-full p-4 bg-black/40 border border-slate-700 rounded-2xl outline-none text-sm text-amber-400 focus:border-amber-500">
                </div>`;
        }

        function generateUserInputs() {
            const container = document.getElementById('dynamicUserInputs');
            container.innerHTML = '<input type="hidden" id="editIndex" value="-1">';
            userFields.forEach(f => {
                container.innerHTML += `
                    <div>
                        <label class="text-[9px] text-slate-500 font-black uppercase ml-2 tracking-widest">${f}</label>
                        <input type="text" id="userfield_${f}" class="w-full p-4 bg-slate-800 border border-slate-700 rounded-2xl outline-none text-sm text-white focus:border-emerald-500">
                    </div>`;
            });
        }

        function renderUserList(data) {
            const list = document.getElementById('userList');
            list.innerHTML = '';
            data.forEach((u, i) => {
                let details = '';
                Object.keys(u).forEach(k => details += `<div class="flex justify-between py-1 border-b border-white/5"><span class="text-[8px] text-slate-500 font-bold">${k}</span><span class="text-[10px] font-mono text-emerald-400">${u[k]}</span></div>`);

                list.innerHTML += `
                    <div class="bg-slate-900/60 p-5 rounded-[2rem] border border-white/5 shadow-lg">
                        <div class="flex justify-between items-center mb-3">
                            <div class="font-black text-white italic uppercase">${u.ID || 'USER'}</div>
                            <div class="flex gap-2">
                                <button onclick="editUser(${i})" class="text-blue-400 p-2"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="deleteUser(${i})" class="text-red-400 p-2"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                        <div class="bg-black/40 p-4 rounded-2xl space-y-1">${details}</div>
                    </div>`;
            });
        }

        async function saveGlobalConfig() {
            for (let key in fullData) {
                const el = document.getElementById(`global_${key}`);
                if (el) fullData[key] = el.value;
            }
            await pushToGitHub("Update Global Config");
        }

        async function saveUserData() {
            const index = parseInt(document.getElementById('editIndex').value);
            let newUser = {};
            userFields.forEach(f => newUser[f] = document.getElementById(`userfield_${f}`).value);
            
            if (index === -1) userArrayRef.push(newUser);
            else userArrayRef[index] = newUser;
            
            await pushToGitHub("Update User List");
            resetForm();
        }

        function editUser(i) {
            const u = userArrayRef[i];
            document.getElementById('editIndex').value = i;
            userFields.forEach(f => document.getElementById(`userfield_${f}`).value = u[f]);
            document.getElementById('btnCancel').classList.remove('hidden');
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        async function deleteUser(i) {
            if(!confirm("Hapus user?")) return;
            userArrayRef.splice(i, 1);
            await pushToGitHub("Remove User");
        }

        function resetForm() {
            document.getElementById('editIndex').value = "-1";
            userFields.forEach(f => document.getElementById(`userfield_${f}`).value = '');
            document.getElementById('btnCancel').classList.add('hidden');
        }

        function filterData() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const f = userArrayRef.filter(u => Object.values(u).some(v => String(v).toLowerCase().includes(q)));
            renderUserList(f);
        }

        async function pushToGitHub(msg) {
            const token = document.getElementById('ghToken').value;
            const repo = document.getElementById('repoSelect').value;
            const file = document.getElementById('fileSelect').value;
            const resSha = await fetch(`https://api.github.com/repos/${OWNER}/${repo}/contents/${file}`, {
                headers: { Authorization: `token ${token}` }
            });
            const dataSha = await resSha.json();
            await fetch(`https://api.github.com/repos/${OWNER}/${repo}/contents/${file}`, {
                method: 'PUT',
                headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: msg,
                    content: btoa(JSON.stringify(fullData, null, 2)),
                    sha: dataSha.sha
                })
            });
            alert("Berhasil!");
            loadJsonData();
        }
    </script>
</body>
</html>
