<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Ican2233</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#0b1120] min-h-screen pb-20 font-sans text-slate-200">

    <div class="bg-gradient-to-r from-blue-600 to-indigo-800 p-8 shadow-2xl mb-6 rounded-b-[3rem] border-b border-white/10 text-center">
        <h1 class="text-2xl font-black italic text-white uppercase tracking-tighter">Ican2233 Control Center</h1>
        <p class="text-[10px] opacity-60 tracking-[0.4em] uppercase mt-1">Multi-Repo & Expiry Manager</p>
    </div>

    <div class="max-w-md mx-auto px-4">
        
        <div class="bg-slate-900/80 p-6 rounded-3xl border border-white/5 mb-6 shadow-xl">
            <div id="loginArea">
                <input type="password" id="ghToken" placeholder="GitHub Token (ghp_...)" class="w-full p-4 bg-black/40 border border-slate-700 rounded-2xl mb-4 outline-none text-sm text-emerald-400 focus:border-blue-500 transition shadow-inner">
                <button onclick="fetchAllRepos()" class="w-full bg-blue-600 hover:bg-blue-500 text-white p-4 rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg">Connect Account</button>
            </div>

            <div id="selectorArea" class="hidden space-y-4 mt-4">
                <select id="repoSelect" onchange="fetchFiles()" class="w-full p-4 bg-slate-800 rounded-2xl font-bold text-sm border border-slate-600 outline-none text-white appearance-none"></select>
                <select id="fileSelect" class="w-full p-4 bg-slate-800 rounded-2xl font-bold text-sm border border-slate-600 outline-none text-white appearance-none"></select>
                <button onclick="loadJsonData()" class="w-full bg-indigo-600 text-white p-4 rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg">Load Data</button>
            </div>
        </div>

        <div id="editorArea" class="hidden bg-slate-900 p-6 rounded-[2.5rem] shadow-2xl mb-8 border-l-8 border-blue-500 border border-white/5">
            <h2 id="formTitle" class="text-blue-400 font-black text-xs mb-6 uppercase tracking-widest flex items-center">
                <i class="fa-solid fa-user-plus mr-2"></i> User Editor
            </h2>
            <div id="dynamicInputs" class="space-y-4">
                </div>
            <div class="flex gap-3 mt-8">
                <button onclick="saveUserData()" id="btnSaveUser" class="flex-1 bg-blue-600 text-white p-5 rounded-2xl font-black text-xs uppercase shadow-lg active:scale-95 transition">Save User</button>
                <button id="btnCancel" onclick="resetForm()" class="hidden bg-slate-700 text-white p-5 rounded-2xl font-black text-xs uppercase">Cancel</button>
            </div>
        </div>

        <div id="configEditorArea" class="hidden bg-slate-900 p-6 rounded-[2.5rem] shadow-2xl mb-8 border-t-8 border-amber-500 border border-white/5">
            <h2 class="text-amber-400 font-black text-xs mb-6 uppercase tracking-widest">Global Settings</h2>
            <div id="configInputs" class="space-y-5"></div>
            <button onclick="saveConfigData()" class="w-full mt-6 bg-amber-600 text-white p-4 rounded-2xl font-black text-xs uppercase shadow-lg">Update Settings</button>
        </div>

        <div id="dataArea" class="hidden">
            <input type="text" id="searchInput" onkeyup="filterData()" placeholder="Cari ID atau Expiry..." class="w-full p-5 bg-slate-900 rounded-2xl border border-slate-800 outline-none text-sm mb-6 focus:border-blue-500 shadow-xl transition">
            <div id="userList" class="space-y-4"></div>
        </div>

    </div>

    <script>
        const OWNER = 'Ican2233';
        let fullData = null; // Seluruh JSON
        let userArray = [];  // Isi dari "Users"
        let currentFields = [];

        async function fetchAllRepos() {
            const token = document.getElementById('ghToken').value;
            try {
                const res = await fetch(`https://api.github.com/users/${OWNER}/repos?per_page=100&sort=updated`, {
                    headers: { Authorization: `token ${token}` }
                });
                const repos = await res.json();
                const select = document.getElementById('repoSelect');
                select.innerHTML = '<option value="">-- CHOOSE REPO --</option>';
                repos.forEach(r => select.innerHTML += `<option value="${r.name}">${r.name.toUpperCase()}</option>`);
                document.getElementById('selectorArea').classList.remove('hidden');
                document.getElementById('loginArea').classList.add('hidden');
            } catch (e) { alert("Token Error!"); }
        }

        async function fetchFiles() {
            const token = document.getElementById('ghToken').value;
            const repo = document.getElementById('repoSelect').value;
            const res = await fetch(`https://api.github.com/repos/${OWNER}/${repo}/contents/`, {
                headers: { Authorization: `token ${token}` }
            });
            const files = await res.json();
            const select = document.getElementById('fileSelect');
            select.innerHTML = '<option value="">-- CHOOSE FILE --</option>';
            files.filter(f => f.name.endsWith('.json')).forEach(f => select.innerHTML += `<option value="${f.name}">${f.name}</option>`);
        }

        async function loadJsonData() {
            const token = document.getElementById('ghToken').value;
            const repo = document.getElementById('repoSelect').value;
            const file = document.getElementById('fileSelect').value;
            const res = await fetch(`https://api.github.com/repos/${OWNER}/${repo}/contents/${file}`, {
                headers: { Authorization: `token ${token}` },
                cache: 'no-store'
            });
            const content = await res.json();
            fullData = JSON.parse(atob(content.content));
            
            // Cek apakah ada properti "Users" (Array)
            if(fullData.Users && Array.isArray(fullData.Users)) {
                userArray = fullData.Users;
                currentFields = userArray.length > 0 ? Object.keys(userArray[0]) : ['ID', 'Expiry'];
                
                document.getElementById('editorArea').classList.remove('hidden');
                document.getElementById('dataArea').classList.remove('hidden');
                document.getElementById('configEditorArea').classList.remove('hidden');
                
                generateConfigFields();
                generateUserInputs();
                renderUserList(userArray);
            } else {
                alert("Format JSON tidak mendukung daftar 'Users'. Gunakan editor standar.");
            }
        }

        function generateConfigFields() {
            const container = document.getElementById('configInputs');
            container.innerHTML = '';
            for (let key in fullData) {
                if(key !== 'Users') {
                    container.innerHTML += `
                    <div>
                        <label class="text-[9px] text-amber-500 font-bold uppercase tracking-widest ml-1">${key}</label>
                        <input type="text" id="cfg_${key}" value="${fullData[key]}" class="w-full p-4 bg-black/30 border border-slate-700 rounded-2xl text-sm text-white">
                    </div>`;
                }
            }
        }

        function generateUserInputs() {
            const container = document.getElementById('dynamicInputs');
            container.innerHTML = '<input type="hidden" id="editIndex" value="-1">';
            currentFields.forEach(f => {
                const isDate = f.toLowerCase().includes('exp');
                container.innerHTML += `
                    <div>
                        <label class="text-[9px] text-slate-500 font-bold uppercase tracking-widest ml-1">${f}</label>
                        <input type="${isDate ? 'date' : 'text'}" id="field_${f}" placeholder="Isi ${f}..." 
                        class="w-full p-4 bg-slate-800 border border-slate-700 rounded-2xl text-sm text-white focus:border-blue-500 outline-none">
                    </div>`;
            });
        }

        function renderUserList(data) {
            const list = document.getElementById('userList');
            document.getElementById('count').innerText = data.length;
            list.innerHTML = '';
            
            data.forEach((u, i) => {
                let details = '';
                Object.keys(u).forEach(k => {
                    details += `
                    <div class="flex justify-between py-1 border-b border-white/5">
                        <span class="text-[8px] text-slate-500 font-bold uppercase">${k}</span>
                        <span class="text-[10px] text-blue-400 font-mono">${u[k]}</span>
                    </div>`;
                });

                list.innerHTML += `
                <div class="bg-slate-900/60 p-5 rounded-[2rem] border border-white/5 shadow-lg">
                    <div class="flex justify-between items-start mb-3">
                        <div class="font-black text-white text-lg italic uppercase tracking-tighter">${u.ID || 'NO ID'}</div>
                        <div class="flex gap-2">
                            <button onclick="editMode(${i})" class="w-9 h-9 bg-blue-500/10 text-blue-400 rounded-xl flex items-center justify-center border border-blue-500/20"><i class="fa-solid fa-pen text-xs"></i></button>
                            <button onclick="deleteUser(${i})" class="w-9 h-9 bg-red-500/10 text-red-400 rounded-xl flex items-center justify-center border border-red-500/20"><i class="fa-solid fa-trash text-xs"></i></button>
                        </div>
                    </div>
                    <div class="bg-black/20 p-4 rounded-2xl space-y-1">${details}</div>
                </div>`;
            });
        }

        function editMode(i) {
            const u = userArray[i];
            document.getElementById('editIndex').value = i;
            currentFields.forEach(f => {
                const input = document.getElementById(`field_${f}`);
                if(input.type === 'date') {
                    // Convert DD/MM/YYYY to YYYY-MM-DD
                    const parts = u[f].split('/');
                    if(parts.length === 3) input.value = `${parts[2]}-${parts[1]}-${parts[0]}`;
                } else {
                    input.value = u[f];
                }
            });
            document.getElementById('btnCancel').classList.remove('hidden');
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        async function saveUserData() {
            const index = parseInt(document.getElementById('editIndex').value);
            let newUser = {};
            currentFields.forEach(f => {
                const input = document.getElementById(`field_${f}`);
                if(input.type === 'date' && input.value) {
                    // Convert YYYY-MM-DD to DD/MM/YYYY
                    const d = input.value.split('-');
                    newUser[f] = `${d[2]}/${d[1]}/${d[0]}`;
                } else {
                    newUser[f] = input.value;
                }
            });

            if(index === -1) userArray.push(newUser); else userArray[index] = newUser;
            await pushToGitHub("Sync User");
            resetForm();
        }

        async function saveConfigData() {
            for(let key in fullData) {
                if(key !== 'Users') {
                    fullData[key] = document.getElementById(`cfg_${key}`).value;
                }
            }
            await pushToGitHub("Update Global Config");
        }

        async function pushToGitHub(msg) {
            const token = document.getElementById('ghToken').value;
            const repo = document.getElementById('repoSelect').value;
            const file = document.getElementById('fileSelect').value;
            
            const resSha = await fetch(`https://api.github.com/repos/${OWNER}/${repo}/contents/${file}`, {
                headers: { Authorization: `token ${token}` }
            });
            const dataSha = await resSha.json();

            const res = await fetch(`https://api.github.com/repos/${OWNER}/${repo}/contents/${file}`, {
                method: 'PUT',
                headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: msg,
                    content: btoa(JSON.stringify(fullData, null, 2)),
                    sha: dataSha.sha
                })
            });
            if(res.ok) { alert("Berhasil Disimpan!"); loadJsonData(); }
        }

        function resetForm() {
            document.getElementById('editIndex').value = "-1";
            currentFields.forEach(f => document.getElementById(`field_${f}`).value = "");
            document.getElementById('btnCancel').classList.add('hidden');
        }

        async function deleteUser(i) {
            if(!confirm("Hapus user ini?")) return;
            userArray.splice(i, 1);
            await pushToGitHub("Remove User");
        }

        function filterData() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = userArray.filter(u => Object.values(u).some(v => String(v).toLowerCase().includes(q)));
            renderUserList(filtered);
        }
    </script>
</body>
</html>
