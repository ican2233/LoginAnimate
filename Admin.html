<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Manager Ican2233</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#0b0f1a] min-h-screen pb-20 font-sans text-slate-200">

    <div class="bg-gradient-to-r from-blue-700 to-indigo-900 p-8 shadow-2xl mb-6 rounded-b-[3rem] border-b border-white/10 text-center">
        <h1 class="text-2xl font-black tracking-tighter italic text-white uppercase">Ican2233 Smart Admin</h1>
        <p class="text-[10px] opacity-70 tracking-[0.4em] uppercase mt-1">Universal JSON & User Controller</p>
    </div>

    <div class="max-w-md mx-auto px-4">
        
        <div class="bg-slate-900/80 backdrop-blur-md p-6 rounded-3xl border border-white/5 mb-6 shadow-xl">
            <div id="loginArea">
                <input type="password" id="ghToken" placeholder="GitHub Token (ghp_...)" class="w-full p-4 bg-black/40 border border-slate-700 rounded-2xl mb-4 outline-none text-sm text-emerald-400 focus:border-blue-500 transition shadow-inner">
                <button onclick="fetchAllRepos()" class="w-full bg-blue-600 text-white p-4 rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg active:scale-95 transition">Hubungkan Akun</button>
            </div>

            <div id="selectorArea" class="hidden space-y-4 mt-4 animate-in fade-in">
                <select id="repoSelect" onchange="fetchFiles()" class="w-full p-4 bg-slate-800 rounded-2xl font-bold text-sm border border-slate-600 text-white appearance-none"></select>
                <select id="fileSelect" class="w-full p-4 bg-slate-800 rounded-2xl font-bold text-sm border border-slate-600 text-white appearance-none"></select>
                <button onclick="loadJsonData()" class="w-full bg-indigo-600 text-white p-4 rounded-2xl font-black text-xs uppercase tracking-widest">Buka Database</button>
            </div>
        </div>

        <div id="configArea" class="hidden bg-slate-900 p-6 rounded-[2.5rem] shadow-2xl mb-8 border-t-8 border-amber-500 border border-white/5">
            <h2 class="text-amber-400 font-black text-xs mb-6 uppercase tracking-widest flex items-center">
                <i class="fa-solid fa-gears mr-2"></i> Global Config
            </h2>
            <div id="configInputs" class="space-y-4"></div>
            <button onclick="saveGlobalConfig()" class="w-full mt-6 bg-amber-600 text-white p-5 rounded-2xl font-black text-xs uppercase shadow-lg active:scale-95">Update Config</button>
        </div>

        <div id="userEditorArea" class="hidden bg-slate-900 p-6 rounded-[2.5rem] shadow-2xl mb-8 border-l-8 border-emerald-500 border border-white/5">
            <h2 id="formTitle" class="text-emerald-400 font-black text-xs mb-6 uppercase tracking-widest">Manajemen User</h2>
            <div id="userInputs" class="space-y-4 mt-4"></div>
            <div class="flex gap-3 mt-8">
                <button onclick="saveUserData()" id="btnSaveUser" class="flex-1 bg-emerald-600 text-white p-5 rounded-2xl font-black text-xs uppercase shadow-lg active:scale-95">Simpan User</button>
                <button id="btnCancel" onclick="resetUserForm()" class="hidden bg-slate-700 text-white p-5 rounded-2xl font-black text-xs uppercase">Batal</button>
            </div>
        </div>

        <div id="listArea" class="hidden">
            <div class="relative mb-6">
                <i class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-slate-500"></i>
                <input type="text" id="searchInput" onkeyup="filterUser()" placeholder="Cari user..." class="w-full p-5 pl-14 bg-slate-900 rounded-2xl border border-slate-800 outline-none text-sm focus:border-blue-500 shadow-xl">
            </div>
            <div id="userList" class="space-y-4"></div>
        </div>

    </div>

    <script>
        const OWNER = 'Ican2233';
        let rawData = null; // Full JSON
        let userArray = []; // Pointer ke list user
        let userFields = [];

        async function fetchAllRepos() {
            const token = document.getElementById('ghToken').value;
            try {
                const res = await fetch(`https://api.github.com/users/${OWNER}/repos?per_page=100&sort=updated`, {
                    headers: { Authorization: `token ${token}` }
                });
                const repos = await res.json();
                const select = document.getElementById('repoSelect');
                select.innerHTML = '<option value="">-- PILIH REPO --</option>';
                repos.forEach(r => select.innerHTML += `<option value="${r.name}">${r.name.toUpperCase()}</option>`);
                document.getElementById('selectorArea').classList.remove('hidden');
                document.getElementById('loginArea').classList.add('hidden');
            } catch (e) { alert("Gagal!"); }
        }

        async function fetchFiles() {
            const token = document.getElementById('ghToken').value;
            const repo = document.getElementById('repoSelect').value;
            const res = await fetch(`https://api.github.com/repos/${OWNER}/${repo}/contents/`, {
                headers: { Authorization: `token ${token}` }
            });
            const files = await res.json();
            const select = document.getElementById('fileSelect');
            select.innerHTML = '<option value="">-- PILIH FILE --</option>';
            files.filter(f => f.name.endsWith('.json')).forEach(f => select.innerHTML += `<option value="${f.name}">${f.name}</option>`);
        }

        async function loadJsonData() {
            const token = document.getElementById('ghToken').value;
            const repo = document.getElementById('repoSelect').value;
            const file = document.getElementById('fileSelect').value;

            const res = await fetch(`https://api.github.com/repos/${OWNER}/${repo}/contents/${file}`, {
                headers: { Authorization: `token ${token}` }, cache: 'no-store'
            });
            const data = await res.json();
            rawData = JSON.parse(atob(data.content));

            // RESET TAMPILAN
            document.getElementById('configInputs').innerHTML = '';
            document.getElementById('userInputs').innerHTML = '<input type="hidden" id="editIndex" value="-1">';
            
            // 1. CARI GLOBAL CONFIG (Teks Biasa)
            for (let key in rawData) {
                if (typeof rawData[key] !== 'object') {
                    document.getElementById('configInputs').innerHTML += `
                        <div class="space-y-1">
                            <label class="text-[9px] text-slate-500 font-bold uppercase ml-2">${key}</label>
                            <input type="text" id="cfg_${key}" value="${rawData[key]}" class="w-full p-4 bg-black/40 border border-slate-700 rounded-2xl text-sm text-amber-400">
                        </div>`;
                }
            }
            document.getElementById('configArea').classList.remove('hidden');

            // 2. CARI DAFTAR USER (Mencari Array bernama 'Users' atau sejenisnya)
            userArray = rawData.Users || (Array.isArray(rawData) ? rawData : null);
            
            if (userArray) {
                document.getElementById('userEditorArea').classList.remove('hidden');
                document.getElementById('listArea').classList.remove('hidden');
                
                userFields = userArray.length > 0 ? Object.keys(userArray[0]) : ['ID', 'Expiry'];
                userFields.forEach(f => {
                    const isDate = f.toLowerCase().includes('exp');
                    document.getElementById('userInputs').innerHTML += `
                        <div class="space-y-1">
                            <label class="text-[9px] text-slate-500 font-bold uppercase ml-2">${f}</label>
                            <input type="${isDate ? 'date' : 'text'}" id="field_${f}" class="w-full p-4 bg-slate-800 border border-slate-700 rounded-2xl text-sm text-white focus:border-emerald-500">
                        </div>`;
                });
                renderUserList();
            }
        }

        function renderUserList() {
            const list = document.getElementById('userList');
            list.innerHTML = '';
            userArray.forEach((u, i) => {
                let detailStr = '';
                Object.keys(u).forEach(k => {
                    detailStr += `<div class="flex justify-between border-b border-white/5 py-1">
                        <span class="text-[8px] text-slate-500 uppercase font-bold">${k}</span>
                        <span class="text-[10px] text-emerald-400 font-mono">${u[k]}</span>
                    </div>`;
                });

                list.innerHTML += `
                    <div class="bg-slate-900/60 p-5 rounded-[2rem] border border-white/5 shadow-lg">
                        <div class="flex justify-between items-center mb-3">
                            <div class="font-black text-white italic uppercase">${u.ID || u.username || 'USER'}</div>
                            <div class="flex gap-2">
                                <button onclick="editUser(${i})" class="text-blue-400 p-2"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="deleteUser(${i})" class="text-red-400 p-2"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                        <div class="bg-black/40 p-4 rounded-2xl space-y-1">${detailStr}</div>
                    </div>`;
            });
        }

        async function saveGlobalConfig() {
            for (let key in rawData) {
                if (typeof rawData[key] !== 'object') {
                    rawData[key] = document.getElementById(`cfg_${key}`).value;
                }
            }
            await pushToGitHub("Update Global Config");
        }

        async function saveUserData() {
            const index = parseInt(document.getElementById('editIndex').value);
            let newUser = {};
            userFields.forEach(f => {
                let val = document.getElementById(`field_${f}`).value;
                // Jika input tanggal, format ulang ke DD/MM/YYYY jika perlu, 
                // tapi di sini kita simpan apa adanya dari input date
                newUser[f] = val;
            });

            if (index === -1) userArray.push(newUser); else userArray[index] = newUser;
            
            // Pastikan data masuk kembali ke objek utama
            if (rawData.Users) rawData.Users = userArray; 
            else if (Array.isArray(rawData)) rawData = userArray;

            await pushToGitHub("Update Users Data");
            resetUserForm();
        }

        function editUser(i) {
            const u = userArray[i];
            document.getElementById('editIndex').value = i;
            userFields.forEach(f => {
                const el = document.getElementById(`field_${f}`);
                if(el.type === 'date' && u[f].includes('/')) {
                    // Convert DD/MM/YYYY to YYYY-MM-DD for date input
                    const parts = u[f].split('/');
                    el.value = `${parts[2]}-${parts[1]}-${parts[0]}`;
                } else {
                    el.value = u[f];
                }
            });
            document.getElementById('btnCancel').classList.remove('hidden');
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function resetUserForm() {
            document.getElementById('editIndex').value = "-1";
            userFields.forEach(f => document.getElementById(`field_${f}`).value = '');
            document.getElementById('btnCancel').classList.add('hidden');
        }

        async function deleteUser(i) {
            if(!confirm("Hapus user?")) return;
            userArray.splice(i, 1);
            await pushToGitHub("Delete User");
        }

        async function pushToGitHub(msg) {
            const token = document.getElementById('ghToken').value;
            const repo = document.getElementById('repoSelect').value;
            const file = document.getElementById('fileSelect').value;
            
            const resSha = await fetch(`https://api.github.com/repos/${OWNER}/${repo}/contents/${file}`, {
                headers: { Authorization: `token ${token}` }
            });
            const dataSha = await resSha.json();

            const res = await fetch(`https://api.github.com/repos/${OWNER}/${repo}/contents/${file}`, {
                method: 'PUT',
                headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: msg,
                    content: btoa(JSON.stringify(rawData, null, 2)),
                    sha: dataSha.sha
                })
            });
            if(res.ok) alert("Berhasil Terupdate!");
            loadJsonData();
        }

        function filterUser() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('#userList > div');
            cards.forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(q) ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
